[package]
name = "remote-desktop-client"
version = "0.1.0"
description = "Tauri shell for the remote desktop viewer"
authors = ["Remote Desktop App"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["winuser", "processthreadsapi", "handleapi"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
