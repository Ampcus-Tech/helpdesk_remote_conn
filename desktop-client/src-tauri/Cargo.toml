[package]
name = "remote-desktop-client"
version = "0.1.0"
description = "Tauri shell for the remote desktop viewer"
authors = ["Remote Desktop App"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
